<!DOCTYPE html>

<head>

    <title>CAFE NEST | 公式サイト</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo"><a href="index.html">CAFE NEST</a></div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="menu.html">MENU</a>
            <a href="access.html">ACCESS</a>
        </nav>
    </header>

    <!-- 💡 変更点：自動スライドショーの構造（JavaScriptを使わずCSSだけで動かします） -->
    <section class="hero">
        <div class="slide slide1"></div>
        <div class="slide slide2"></div>
        <div class="slide slide3"></div>
        <div class="hero-overlay"></div>
        <div class="hero-text">
            <h2>木漏れ日と、珈琲の香り。</h2>
            <p>あわただしい日常から少しだけ離れて<br>豊かな緑と丁寧に淹れた珈琲を。</p>
        </div>
    </section>

    <section id="about" class="container">
        <h3 class="section-title">ABOUT</h3>
        <div class="about-flex">
            <div class="about-img">
                <img src="https://images.unsplash.com/photo-1453614512568-c4024d13c247?auto=format&fit=crop&q=80&w=800" alt="店内の様子">
            </div>
            <!-- 💡 変更点：ご指定通りの位置に改行（br）を入れました -->
            <div class="about-text">
                <p>
                    CAFE NEST（ネスト）は、緑豊かな自然に囲まれた<br>
                    「巣」のように、誰もが素顔に戻ってホッと<br>
                    息をつける場所を目指しています。
                </p>
                <p>
                    窓から差し込む木漏れ日を感じながら、<br>
                    厳選したオーガニック豆を使用したハンドドリップコーヒーと、<br>
                    毎朝焼き上げる自家製の焼き菓子をお楽しみください。
                </p>
            </div>
        </div>
        
        <div class="home-buttons">
            <a href="menu.html" class="btn">メニューを見る</a>
            <a href="access.html" class="btn btn-outline">アクセス・店舗情報</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 CAFE NEST. All rights reserved.</p>
    </footer>
